networks:
  infra_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

services:
  # Metadata Veritabanı Servisi
  metadata-db:
    image: postgres:15-alpine
    container_name: infra_metadata_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra_network
    restart: always

  # Nesne Depolama (S3 Uyumlu MinIO) Servisi
  storage-engine:
    image: minio/minio:latest
    container_name: infra_storage_engine
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - infra_network
    command: server /data --console-address ":9001"
    restart: always

  # Apache Spark Master Servisi (Resmi Apache İmajı)
  spark-master:
    image: apache/spark:3.5.0
    container_name: infra_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - infra_network
    restart: always

  # Apache Spark Worker Servisi (Resmi Apache İmajı)
  spark-worker:
    image: apache/spark:3.5.0
    container_name: infra_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    depends_on:
      - spark-master
    networks:
      - infra_network
    restart: always

    # Airflow Veritabanı İlklendirme
  airflow-init:
    image: ${AIRFLOW_IMAGE}
    container_name: infra_airflow_init
    command: version # Sadece veritabanını hazırlayıp versiyon basıp dursun
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@metadata-db:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
    depends_on:
      - metadata-db
    networks:
      - infra_network

  # Airflow Web Arayüzü (Webserver)
  airflow-webserver:
    image: ${AIRFLOW_IMAGE}
    container_name: infra_airflow_webserver
    command: webserver # <--- KRİTİK EKLEME: Airflow'a web sunucusu olduğunu söyledik
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@metadata-db:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
    depends_on:
      - metadata-db
    networks:
      - infra_network
    restart: always

  # Airflow Zamanlayıcı (Scheduler)
  airflow-scheduler:
    image: ${AIRFLOW_IMAGE}
    container_name: infra_airflow_scheduler
    command: scheduler # <--- KRİTİK EKLEME: Airflow'a zamanlayıcı motoru olduğunu söyledik
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@metadata-db:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
    depends_on:
      - metadata-db
    networks:
      - infra_network
    restart: always



  